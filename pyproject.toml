[tool.ruff]
# Pinned so a Ruff release cannot silently change formatting and turn CI
# red without a code change. Keep in sync with the `version` input in
# .github/workflows/lint.yaml — that is what actually drives the install;
# this is the local guard so `ruff` refuses to run at a different version.
required-version = "0.16.8"
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components/delonghi_coffee"]

[tool.coverage.report]
fail_under = 50
show_missing = true
skip_covered = false
