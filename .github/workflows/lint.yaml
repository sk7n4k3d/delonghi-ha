name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The `version` input is explicit on purpose. Without it, ruff-action
      # falls back to `latest` (it only auto-discovers a version from
      # project.dependencies / dependency-groups, which this pyproject does
      # not declare). That is what let 0.16.8 land unannounced and turn the
      # format check red on untouched files. Keep in sync with
      # `required-version` in pyproject.toml.
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
        with:
          version: "0.16.8"
          args: check
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
        with:
          version: "0.16.8"
          args: format --check
